# Render Blueprint: the whole app (API server + website) as one web service. Steps: docs/DEPLOYMENTS.md.
# The server serves the built website from the same address, so login cookies are first-party.
services:
  - type: web
    name: clavis
    runtime: node
    plan: free
    buildCommand: npx --yes pnpm@10.28.0 install --frozen-lockfile --prod=false && npx --yes pnpm@10.28.0 --filter @clavis/web build
    startCommand: npx --yes pnpm@10.28.0 --filter @clavis/server start
    healthCheckPath: /api/meta
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: NETWORK
        value: testnet
      - key: SESSION_SECRET
        generateValue: true
      - key: ONECLICK_API_KEY
        sync: false
      - key: CLAVIS_CONTRACT_ID
        value: clavis-app.testnet
      - key: COMMITTER_ACCOUNT_ID
        value: clavis-committer.testnet
      - key: COMMITTER_PRIVATE_KEY
        sync: false
      # Website settings, read when it is built. VITE_API_URL is left unset: same address as the API.
      - key: VITE_NETWORK
        value: testnet
      - key: VITE_CLAVIS_CONTRACT_ID
        value: clavis-app.testnet
